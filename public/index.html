<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />

    <!-- 1. 網頁標題 -->
    <title>Fengyezheyin No.3 住戶服務平台</title>

    <!-- 2. 網頁描述 -->
    <meta
      name="description"
      content="Fengyezheyin No.3 住戶專屬系統：公告查詢、財務透明、意見回報。"
    />

    <!-- 3. LINE / Facebook 分享預覽卡片設定 -->
    <meta property="og:title" content="Fengyezheyin No.3 住戶服務平台" />
    <meta
      property="og:description"
      content="住戶專屬數位管家，點擊查看最新公告與財務報表。"
    />
    <!-- 修改點 A：分享時的縮圖，改成您上傳的檔案名稱 -->
    <meta property="og:image" content="%PUBLIC_URL%/community-icon.png" />
    <meta property="og:type" content="website" />

    <!-- 4. 手機主畫面圖示 (App Icon) -->
    <!-- 修改點 B：瀏覽器分頁小圖示，改成您上傳的檔案名稱 -->
    <link rel="icon" href="%PUBLIC_URL%/community-icon.png" />
    <!-- 修改點 C：iPhone 主畫面圖示，改成您上傳的檔案名稱 -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/community-icon.png" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  </head>
  <body>
    <noscript>請開啟 JavaScript 以使用本系統。</noscript>
    <div id="root"></div>
  </body>
</html>
